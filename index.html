<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The World in a Scribble</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>The World in a Scribble</h1>
  </header>

  <main>
    <div id="canvas-wrap">
      <canvas id="board"></canvas>
    </div>

    <div id="draw-controls" class="controls">
      <div class="toolbar" role="toolbar" aria-label="Drawing tools">
        <button type="button" class="tool active" data-tool="line" title="Line">Line</button>
        <button type="button" class="tool" data-tool="ellipse" title="Ellipse">Ellipse</button>
        <button type="button" class="tool" data-tool="scribble" title="Scribble">Scribble</button>
        <button type="button" class="tool" data-tool="highlight" title="Highlight">Highlight</button>
        <button type="button" class="tool" data-tool="fill" title="Fill">Fill</button>
        <button type="button" class="tool" data-tool="erase-fill" title="Erase Fill">Erase Fill</button>
        <button type="button" class="tool" data-tool="border" title="Border">Border</button>
        <button type="button" class="tool" data-tool="erase" title="Erase">Erase</button>
      </div>

      <div class="slider-row">
        <label for="thickness">Thickness: <span id="thickness-value">2</span>px</label>
        <input type="range" id="thickness" min="1" max="60" value="2">
      </div>

      <div class="action-row">
        <button type="button" id="clear-btn">Clear</button>
        <button type="button" id="start-btn" class="primary">Start</button>
      </div>
    </div>

    <div id="play-controls" class="controls hidden">
      <div class="slider-row">
        <label for="rotate">Longitude at midline: <span id="rotate-value">0</span>°</label>
        <input type="range" id="rotate" min="-180" max="180" value="0" step="1">
      </div>
      <div class="action-row">
        <button type="button" id="return-btn">Return</button>
      </div>
    </div>
  </main>

  <script src="js/map-transform.js"></script>
  <script src="js/drawing.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
